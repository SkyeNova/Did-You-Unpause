plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup('maven.modrinth')
		}
	}
	mavenCentral()
}

dependencies {
	// Minecraft and fabric
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Flashback and ModMenu - only needed at compile time, they must already be installed by the player at runtime.
	// ModMenu's published jar is in intermediary mappings, so it needs Loom's "mod" dependency variant to get
	// remapped to the official mappings this project compiles against; Flashback's own jar is already in that
	// namespace so plain compileOnly is enough for it.
	compileOnly "maven.modrinth:flashback:${project.flashback_version}"
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	toolchain.languageVersion.set(JavaLanguageVersion.of(21))
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
